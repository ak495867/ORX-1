name: orx1-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y iverilog verilator yosys
      - name: Check source policy
        run: ./scripts/check_source_policy.sh
      - name: Run simulation
        run: make sim
      - name: Run lint
        run: make lint
      - name: Run synthesis checks
        run: make synth
