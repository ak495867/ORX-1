name: orx1-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator yosys z3 python3-pil
          git clone --depth 1 https://github.com/YosysHQ/sby.git /tmp/sby
          sudo mkdir -p /opt/sby
          sudo cp -r /tmp/sby/sbysrc/. /opt/sby/
          printf '#!/usr/bin/env bash\nexec python3 /opt/sby/sby.py "$@"\n' | sudo tee /usr/local/bin/sby >/dev/null
          sudo chmod +x /usr/local/bin/sby
      - name: Check executable scripts
        run: test -x scripts/check_rtl.sh && test -x scripts/run_sim.sh
      - name: Run C TinyML tests
        run: make test-sw
      - name: Run simulation
        run: make sim
      - name: Run CPU benchmark
        run: make bench
      - name: Run model and speed benchmarks
        run: make model-bench
      - name: Run RISC-V compliance test
        run: make compliance
      - name: Run lint
        run: make lint
      - name: Run synthesis checks
        run: make synth
      - name: Validate physical floorplan constraints
        run: make floorplan
      - name: Validate formal sources
        run: make formal
      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orx1-verification-${{ github.sha }}
          path: build/
          if-no-files-found: warn
